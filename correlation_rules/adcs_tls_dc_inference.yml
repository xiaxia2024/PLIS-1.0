rule:
  id: CORR-ADCS-001
  description: Infer possible ADCS ESC1 scenario from TLS and LDAP exposure

  when:
    - host.role == DomainController
    - services.ldap.exposed == true

  infer:
    - possible_scenarios:
        - id: SC-ADCS-ESC1-VIABLE
          confidence: medium

  then:
    suggest:
      category: verification
      actions:
        - certipy find
        - nxc ldap -M adcs
