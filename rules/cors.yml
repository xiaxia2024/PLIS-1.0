# CORS 配置错误
rules:
  - id: CORS_Wildcard_Origin
    name: CORS Wildcard Detected
    severity: high
    patterns:
      - "Access-Control-Allow-Origin: *"
    description: |
      CORS 全开放，可能导致敏感数据泄露。

  - id: CORS_Allow_Credentials
    name: CORS Credential Leak Risk
    severity: critical
    patterns:
      - "Access-Control-Allow-Credentials: true"
    description: |
      当允许第三方访问 Cookie，风险极高。
